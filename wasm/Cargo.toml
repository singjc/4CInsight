[package]
name = "four-c-insight-wasm"
version = "0.18.0"
edition = "2024"
description = "Rust/WebAssembly bridge for the 4C Insight local-first web application"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
calamine = "0.36.1"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
