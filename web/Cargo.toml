[package]
name = "cfs-expression-merger-web"
version = "0.16.8"
edition = "2024"
description = "WASM browser shell for 4C Cohort Explorer"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.37.0"
futures-util = "0.3"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "Event", "EventTarget", "File", "FileList", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "Node", "Window"] }

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
