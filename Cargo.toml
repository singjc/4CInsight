[package]
name = "cfs-expression-merger"
version = "0.2.0"
edition = "2024"
description = "Memory-bounded merger for gene/transcript expression Excel reports"
license = "MIT"

[lib]
name = "cfs_expression_merger"
path = "src/lib.rs"

[[bin]]
name = "cfs-expression-merge"
path = "src/bin/cfs-expression-merge.rs"

[[bin]]
name = "cfs-expression-merge-gui"
path = "src/bin/cfs-expression-merge-gui.rs"

[dependencies]
anyhow = "1.0"
calamine = "0.36.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
eframe = "0.36.1"
egui_plot = "0.37.0"
rfd = "0.17.2"
tempfile = "3.24"
