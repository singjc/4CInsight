[package]
name = "four-c-insight"
version = "0.17.0"
edition = "2024"
description = "Local-first multi-omics cohort analysis for 4C Insight"
license = "MIT"

[lib]
name = "four_c_insight"
path = "src/lib.rs"

[[bin]]
name = "four-c-insight-cli"
path = "src/bin/four-c-insight-cli.rs"

[dependencies]
anyhow = "1.0"
calamine = "0.36.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
hex = "0.4"
maud = "0.27.0"
plotly = { version = "0.12.1", features = ["plotly_embed_js"] }
report-builder = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.24"
