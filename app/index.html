<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="4C Insight — local-first multi-omics cohort analysis" />
  <link rel="stylesheet" href="./styles.css?v=0.21.0-ux4-branding" />
  <title>4C Insight</title>
</head>
<body>
  <noscript>4C Insight requires JavaScript to run local browser analysis.</noscript>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <h1 class="brand-heading"><img class="brand-logo" src="./assets/4c-insight-logo.svg" alt="4C Insight" width="1116" height="879" /></h1>
      </div>
      <button id="system-chip" type="button" class="privacy-chip system-chip" title="Analysis runs locally. Browser-reported system information only.">
        <span class="privacy-dot"></span><span>Local system</span>
      </button>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="Analysis workflows">
        <div class="sidebar-label">Workflow</div>
        <nav id="workflow-nav" class="workflow-nav"></nav>
        <div id="sidebar-status" class="sidebar-status"></div>
      </aside>
      <main id="main-content" class="main-content"></main>
    </div>
  </div>
  <script type="module" src="./main.js?v=0.21.0-ux4-branding"></script>
</body>
</html>
