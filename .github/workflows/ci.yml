name: 4c-insight-ci

on:
  push:
  pull_request:

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo test --locked

  wasm-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --manifest-path wasm/Cargo.toml --locked
      - run: cargo check --manifest-path wasm/Cargo.toml --locked --target wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install wasm-pack for generated-bindings validation
        run: cargo install wasm-pack --locked
      - name: Build WASM and test generated memory export
        run: |
          wasm-pack build wasm \
            --target web \
            --out-dir ../app/wasm \
            --out-name four_c_insight_wasm \
            --release
          CFS_REQUIRE_WASM_ARTIFACTS=1 node --test app/tests/ux9-wasm-memory.test.mjs app/tests/m1-wasm-integration.test.mjs

  web-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test app/tests/*.test.mjs
      - run: |
          node --check app/main.js
          node --check app/analysis-worker.js
          node --check app/file-classifier.js
          node --check app/save.js
          node --check app/merge-helpers.js
          node --check app/merge-worker.js
          node --check app/coi-serviceworker.js
